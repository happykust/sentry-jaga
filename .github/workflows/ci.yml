name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Линтеры и типы
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  unit:
    name: Юнит-тесты ядра
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Прогнать юнит-тесты (без sentry)
        run: uv run pytest tests/unit --cov --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  integration:
    name: Тесты слоя Sentry (non-blocking)
    runs-on: ubuntu-latest
    # Sentry не публикуется в PyPI выше 23.7.1 и ставится только из исходников
    # (157 зависимостей, нет [build-system]). Установка может не завестись —
    # эта джоба НЕ блокирует merge. Блокирующие гейты: lint + unit.
    continue-on-error: true
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sentry
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Поставить sentry из исходников (опциональная группа)
        run: uv sync --group sentry
      - name: Прогнать тесты слоя Sentry
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/sentry
          SENTRY_REDIS_HOST: localhost
        run: uv run pytest tests/integration -v
