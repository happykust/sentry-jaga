name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI only reads the code: narrow the token to the minimum instead of the default scopes.
permissions:
  contents: read

jobs:
  lint:
    name: Linters and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  unit:
    name: Core unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Run the unit tests (without sentry)
        run: uv run pytest tests/unit --cov --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  typecheck-sentry:
    name: Types against the Sentry API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Fetch the Sentry 26.3.1 sources (code only, no install)
        run: git clone --depth 1 --branch 26.3.1 https://github.com/getsentry/sentry.git .sentry-src
      - name: Check the Sentry layer against the real API
        env:
          MYPYPATH: .sentry-src/src
        run: uv run mypy --follow-imports=silent

  integration:
    name: Sentry layer tests
    runs-on: ubuntu-latest
    # Sentry cannot be installed as a package (not on PyPI above 23.7.1; its source tree has no
    # build backend), so these tests run inside Sentry's *own* environment: a checkout of the tag,
    # its lock installed by hand, its pytest pointed at our test directory. Recipe: CONTRIBUTING.md.
    env:
      SENTRY_SRC: ${{ github.workspace }}/.sentry-src
    steps:
      - name: Check out sentry-jaga
        uses: actions/checkout@v7

      - name: Check out the Sentry 26.3.1 sources (code only — there is nothing to pip install)
        uses: actions/checkout@v7
        with:
          repository: getsentry/sentry
          ref: 26.3.1
          path: .sentry-src

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Postgres, Redis, ClickHouse, Snuba — why exactly these four, and why no Kafka/Relay: see
      # docker-compose.test.yml. `--wait` blocks until every healthcheck is green.
      - name: Start the test infrastructure
        run: docker compose -f docker-compose.test.yml up -d --wait

      # Sentry's uv.lock, flattened to plain pins. Exporting (rather than `uv sync`) lets the
      # install run from a neutral directory below.
      - name: Export the Sentry lock
        working-directory: .sentry-src
        run: uv export --frozen --no-hashes --no-emit-project --group dev -o "$RUNNER_TEMP/sentry-reqs.txt"

      # Run from $RUNNER_TEMP, NOT from the checkout: inside it, `uv pip` would pick up Sentry's own
      # [tool.uv] block, which pins a default index meant for its internal image build. The two
      # indexes cover both halves of the lock: PyPI, and Sentry's own wheels on its devinfra index.
      - name: Install the Sentry environment
        working-directory: ${{ runner.temp }}
        run: |
          uv venv --python 3.13 "$SENTRY_SRC/.venv"
          uv pip install --python "$SENTRY_SRC/.venv/bin/python" \
            --index-url https://pypi.org/simple \
            --extra-index-url https://pypi.devinfra.sentry.io/simple \
            --index-strategy unsafe-best-match \
            -r "$RUNNER_TEMP/sentry-reqs.txt"

      # `import xmlsec` dies with "lxml & xmlsec libxml2 library version mismatch", and Sentry's
      # SAML2 auth provider imports it during django.setup() — so nothing boots at all.
      #
      # The cause is not a version pin: the PyPI wheels of lxml and xmlsec each bundle their OWN
      # copy of libxml2, and the two only work together when those copies happen to agree. Bumping
      # xmlsec merely changes which two copies you get. Building both from source makes them link
      # the one libxml2 that is actually installed, leaving nothing to disagree about. lxml is
      # rebuilt at the version Sentry's lock already chose, so nothing else in the environment moves.
      - name: Rebuild lxml and xmlsec against one libxml2
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxml2-dev libxslt1-dev libxmlsec1-dev libxmlsec1-openssl pkg-config
          LXML_VERSION=$("$SENTRY_SRC/.venv/bin/python" -c \
            'import importlib.metadata as m; print(m.version("lxml"))')
          uv pip install --python "$SENTRY_SRC/.venv/bin/python" \
            --no-binary lxml --no-binary xmlsec \
            --reinstall-package lxml --reinstall-package xmlsec \
            "lxml==$LXML_VERSION" 'xmlsec>=1.3.16'
          # Prove it before 68 tests blame something else for it.
          "$SENTRY_SRC/.venv/bin/python" -c 'import xmlsec, lxml.etree; print("xmlsec imports fine")'

      # Sentry installs itself editable with its own tool instead of a build backend.
      # `uv pip install -e .sentry-src` does NOT work: with no [build-system], the setuptools
      # fallback chokes on Sentry's [project] table.
      - name: Install Sentry (editable)
        working-directory: .sentry-src
        run: .venv/bin/python tools/fast_editable.py --path .

      - name: Install sentry-jaga into the Sentry environment
        working-directory: ${{ runner.temp }}
        run: uv pip install --python "$SENTRY_SRC/.venv/bin/python" -e "$GITHUB_WORKSPACE"

      # Sentry's pytest, our tests. Every flag is load-bearing:
      #   PYTHONPATH  — Sentry puts its repo-root `fixtures` package into INSTALLED_APPS, so the
      #                 repo root has to be importable or django.setup() dies.
      #   -c          — Sentry's pytest config, not ours; it carries `--nomigrations`.
      #   -p          — Sentry's pytest plugin, which configures Django and the silo databases. It
      #                 normally comes from its tests/conftest.py, which we cannot load: both repos
      #                 have a top-level `tests` package and Sentry's would shadow ours.
      - name: Run the Sentry layer tests
        working-directory: .sentry-src
        env:
          PYTHONPATH: ${{ github.workspace }}/.sentry-src
        run: .venv/bin/pytest -c pyproject.toml -p sentry.testutils.pytest "$GITHUB_WORKSPACE/tests/integration" -v
