name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI only reads the code: narrow the token to the minimum instead of the default scopes.
permissions:
  contents: read

jobs:
  lint:
    name: Linters and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  unit:
    name: Core unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Run the unit tests (without sentry)
        run: uv run pytest tests/unit --cov --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  typecheck-sentry:
    name: Types against the Sentry API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Fetch the Sentry 26.3.1 sources (code only, no install)
        run: git clone --depth 1 --branch 26.3.1 https://github.com/getsentry/sentry.git .sentry-src
      - name: Check the Sentry layer against the real API
        env:
          MYPYPATH: .sentry-src/src
        run: uv run mypy --follow-imports=silent

  integration:
    name: Sentry layer tests (non-blocking)
    runs-on: ubuntu-latest
    # Sentry is not published to PyPI above 23.7.1 and can only be installed from source
    # (157 dependencies, no [build-system]). The install may simply fail to come up, so
    # this job does NOT block a merge. The blocking gates are lint + unit.
    continue-on-error: true
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sentry
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install sentry from source (optional group)
        run: uv sync --group sentry
      - name: Run the Sentry layer tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/sentry
          SENTRY_REDIS_HOST: localhost
        run: uv run pytest tests/integration -v
