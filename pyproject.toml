[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentry-jaga"
version = "1.0.0"
description = "Sentry integration for the Jaga issue tracker (Rostelecom)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "Kirill Nikolaevsky", email = "me@happykust.dev" }]
keywords = ["sentry", "jaga", "integration", "issue-tracker"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Bug Tracking",
    "Typing :: Typed",
]
dependencies = ["requests>=2.31"]

[project.urls]
Homepage = "https://github.com/happykust/sentry-jaga"
Repository = "https://github.com/happykust/sentry-jaga"
Changelog = "https://github.com/happykust/sentry-jaga/blob/main/CHANGELOG.md"
Issues = "https://github.com/happykust/sentry-jaga/issues"

# This entry point carries the package into Sentry: it puts `sentry_jaga` into INSTALLED_APPS,
# which gives Django the installation-form template and runs `JagaAppConfig.ready()`, where the
# alert-rule action is registered. There is deliberately no `sentry.plugins` entry point — the
# documented door for a rule action is unusable on Sentry 26.3.1; see `sentry_jaga/apps.py`.
[project.entry-points."sentry.apps"]
sentry_jaga = "sentry_jaga.apps.JagaAppConfig"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "ruff>=0.6",
    "mypy>=2.3.0",
    "types-requests",
    "pre-commit>=3.8",
    # Django only for the installation-form tests; at runtime it arrives with sentry. The <6
    # bound is mandatory: a Django 5.x `URLField` completes a schemeless address to `http://`,
    # a 6.x one to `https://`, and production (Sentry 26.3.1) is on Django 5.2.
    "django>=5.2.11,<6",
]
# There is deliberately no `sentry` dependency group: Sentry cannot be installed as a package at
# all (not on PyPI above 23.7.1, and its source tree has no build backend). The tests of the Sentry
# layer run inside Sentry's own environment — see CONTRIBUTING.md, "Tests of the Sentry layer".

[tool.hatch.build.targets.wheel]
packages = ["src/sentry_jaga"]
# `packages` ships every file under that directory, so an editor's `.bak` or a rebase's `.orig`
# sitting next to a module would be published to PyPI inside the wheel.
exclude = ["*.bak", "*.mbak", "*.orig", "*.rej", "*.swp"]

# jaga-openapi.json is an internal Rostelecom document and must not be published to PyPI under MIT;
# the rest is housekeeping that a distribution does not need.
[tool.hatch.build.targets.sdist]
exclude = [
    "/docs",
    "/tests",
  "/scripts",
  "/docker",
  "/docker-compose.test.yml",
  "/docker-compose.ui.yml",
    "/.github",
    "/.superpowers",
    "/.claude",
    "/.idea",
    "/jaga-openapi.json",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "TID"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["sentry_jaga"]
mypy_path = "src"
# Neither sentry nor rest_framework is a dependency of this package (both arrive with Sentry), so
# they are absent from the unit environment and ship no usable stubs.
[[tool.mypy.overrides]]
module = ["sentry.*", "django.*", "rest_framework.*"]
ignore_missing_imports = true
follow_imports = "silent"

# The Sentry/Django base classes resolve to Any, and strict mode forbids subclassing Any —
# otherwise every class of the integration layer grows a `# type: ignore[misc]`.
[[tool.mypy.overrides]]
module = ["sentry_jaga.*"]
disallow_subclassing_any = false

# The code is checked both without the Sentry sources (sentry.* -> Any) and against them (the
# "Types against the Sentry API" CI job). A `# type: ignore[no-untyped-call]` is required in the
# second run and counts as unused in the first, so silence the warning where they are needed.
[[tool.mypy.overrides]]
module = ["sentry_jaga.issues"]
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["sentry: tests that require the sentry package to be installed"]

[tool.coverage.run]
source = ["src/sentry_jaga"]
branch = true
# These modules import `sentry` at module level, so the unit run cannot import them at all and
# keeping them in the denominator would report a knowingly false number. They are covered by
# `tests/integration/` and by mypy against the real Sentry sources on every PR.
#
# pipeline.py is deliberately absent: it imports `sentry` only inside
# `InstallationConfigView.dispatch`, while the form and `verify_credentials` are tested on django
# alone. That one method is marked `# pragma: no cover`.
omit = [
    "src/sentry_jaga/apps.py",
    "src/sentry_jaga/metadata.py",
    "src/sentry_jaga/integration.py",
    "src/sentry_jaga/issues.py",
    "src/sentry_jaga/sync.py",
    "src/sentry_jaga/notify_action.py",
    "src/sentry_jaga/search.py",
    "src/sentry_jaga/urls.py",
    "src/sentry_jaga/urlconf.py",
]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
# The core is all of the project's logic and the only testable zone: the bar is high.
fail_under = 95
