[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentry-jaga"
version = "1.0.0"
description = "Sentry integration for the Jaga issue tracker (Rostelecom)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "Kirill Nikolaevsky", email = "me@happykust.dev" }]
keywords = ["sentry", "jaga", "integration", "issue-tracker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Bug Tracking",
    "Typing :: Typed",
]
dependencies = ["requests>=2.31"]

[project.urls]
Homepage = "https://github.com/happykust/sentry-jaga"
Repository = "https://github.com/happykust/sentry-jaga"
Changelog = "https://github.com/happykust/sentry-jaga/blob/main/CHANGELOG.md"
Issues = "https://github.com/happykust/sentry-jaga/issues"

# This single entry point carries the whole package into Sentry: `install_plugin_apps()` puts
# `sentry_jaga` into INSTALLED_APPS, which gives Django the installation-form template AND runs
# `JagaAppConfig.ready()` — where the alert-rule action is added to Sentry's rule registry.
#
# There is deliberately NO `sentry.plugins` entry point. That is the documented door for a rule
# action (`Plugin2.get_rules`), and on Sentry 26.3.1 it is nailed shut: `sentry.rules` builds its
# registry at import time, during `django.setup()`, which runs *before* `register_plugins()` ever
# registers a plugin. See the long note in `sentry_jaga/apps.py`.
[project.entry-points."sentry.apps"]
sentry_jaga = "sentry_jaga.apps.JagaAppConfig"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests",
    "pre-commit>=3.8",
    # At runtime Django comes along with sentry (which requires django>=5.2.11).
    # Here it is only needed for the installation form tests: `django.forms` and
    # ValidationError work without configured settings, so the test lives in tests/unit.
    #
    # The <6 upper bound is mandatory: on Django 5.x a `URLField` completes a schemeless
    # address to `http://` by default, while on 6.x it already completes it to `https://`.
    # Letting the tests drift onto Django 6 would mean testing behaviour that production
    # (Sentry 26.3.1 → Django 5.2) does not have — in exactly the place where the
    # divergence costs the service account password.
    "django>=5.2.11,<6",
]
# There is deliberately NO `sentry` dependency group. Sentry cannot be installed as a package
# at all: above 23.7.1 it is not on PyPI, and its source tree is not installable either — the
# pyproject has no `[build-system]` and carries `version = "0.0.0"` (the real metadata lives in
# setup.cfg; upstream installs itself with `tools/fast_editable.py`, not a build backend).
# `uv sync --group sentry` used to be advertised here and could never have worked.
#
# The tests of the Sentry layer therefore run inside Sentry's *own* environment, against a
# checkout of the tag: see the "Tests of the Sentry layer" section of CONTRIBUTING.md and the
# `integration` job in .github/workflows/ci.yml.

[tool.hatch.build.targets.wheel]
packages = ["src/sentry_jaga"]

# The sdist carries only the package code and the project scaffolding. The Jaga API spec
# (jaga-openapi.json) is an internal Rostelecom document and must not be published to PyPI
# under MIT; everything else is housekeeping and is not needed in a distribution.
[tool.hatch.build.targets.sdist]
exclude = [
    "/docs",
    "/tests",
  "/scripts",
    "/.github",
    "/.superpowers",
    "/.claude",
    "/.idea",
    "/jaga-openapi.json",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "TID"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["sentry_jaga"]
mypy_path = "src"
# sentry is not fully typed — do not trip over its internals. `rest_framework` is here for the
# same reason as `sentry`: it is not a dependency of this package (it arrives with Sentry), so it
# is absent from the unit environment, and DRF ships no stubs anyway.
[[tool.mypy.overrides]]
module = ["sentry.*", "django.*", "rest_framework.*"]
ignore_missing_imports = true
follow_imports = "silent"

# The Sentry/Django base classes resolve to Any (the packages are not installed), and strict
# mode forbids subclassing Any. Allow it — otherwise every class of the integration layer
# grows a `# type: ignore[misc]`.
[[tool.mypy.overrides]]
module = ["sentry_jaga.*"]
disallow_subclassing_any = false

# The code is checked in two configurations: without the Sentry sources (sentry.* -> Any) and
# against them (MYPYPATH, the "Types against the Sentry API" CI job). Some Sentry methods are
# unannotated — calling them needs a `# type: ignore[no-untyped-call]`, which is required in
# the second run but counts as unused in the first. Silence the warning only for the modules
# that call untyped Sentry methods.
[[tool.mypy.overrides]]
module = ["sentry_jaga.issues"]
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["sentry: tests that require the sentry package to be installed"]

[tool.coverage.run]
source = ["src/sentry_jaga"]
branch = true
# These modules import `sentry` at module level, so they cannot even be imported in this
# environment — Sentry is not installable as a package (see the note by the dependency groups).
# The unit run therefore never touches them, and keeping them in the denominator would mean
# reporting a knowingly false number; hence `tests/integration/` skip via
# `pytest.importorskip("sentry")`.
#
# They are not untested: `tests/integration/` drives them against a real Sentry, inside Sentry's
# own environment (CONTRIBUTING.md, "Tests of the Sentry layer"; the `integration` CI job). What
# runs on *every* PR, though, is mypy against the real Sentry sources — a separate, blocking job.
#
# pipeline.py is DELIBERATELY absent from this list: it imports `sentry` only inside
# `InstallationConfigView.dispatch`, while the form and `verify_credentials` are tested on
# django alone. Hiding the whole file would hide the covered code too, along with any future
# uncovered code; exactly one method there is uncoverable, and it is marked
# `# pragma: no cover`.
omit = [
    "src/sentry_jaga/apps.py",
    "src/sentry_jaga/metadata.py",
    "src/sentry_jaga/integration.py",
    "src/sentry_jaga/issues.py",
    "src/sentry_jaga/sync.py",
    "src/sentry_jaga/notify_action.py",
    "src/sentry_jaga/search.py",
    "src/sentry_jaga/urls.py",
    "src/sentry_jaga/urlconf.py",
]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
# The core is all of the project's logic and the only testable zone: the bar is high.
fail_under = 95
