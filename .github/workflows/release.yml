name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Сборка дистрибутивов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Собрать sdist и wheel
        run: uv build
      - name: Проверить метаданные
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Публикация в PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sentry-jaga
    permissions:
      id-token: write   # обязательно для trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # Пин на коммит, а не на ветку `release/v1`: джоба несёт `id-token: write`,
      # то есть право выпустить OIDC-токен для trusted publishing в PyPI. Мутабельная
      # ветка означала бы, что любой её сдвиг (в т.ч. недружественный) немедленно
      # получает это право. Обновляется вручную, вместе с проверкой changelog экшена.
      - name: Опубликовать в PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0

  github-release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Создать релиз
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --generate-notes
